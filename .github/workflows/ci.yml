name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-tests:
    name: Docker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build test image
        run: >-
          docker build --target test
          --tag adaptive-wellness-coach:test .

      - name: Run test suite
        run: docker run --rm adaptive-wellness-coach:test
